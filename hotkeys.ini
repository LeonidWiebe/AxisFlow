; ===========================================================================
;  AxisFlow -- default hotkey layout.
;
;  Edit this file to change the DEFAULT keys. No rebuild needed: it is read at
;  start-up from the installed Mod folder. Restart FreeCAD to apply.
;
;  Layering (later wins):
;     1. built-in layout compiled into the module (fallback if this file is
;        missing or damaged -- the workbench always starts)
;     2. THIS FILE
;     3. keys the user changed themselves (stored in FreeCAD's preferences)
;
;  So editing this file changes what a NEW user gets, and what everyone gets
;  back after "reset settings" -- it does not silently overwrite a key someone
;  deliberately rebound. To adopt this file after you have already changed keys,
;  run in the Python console:   import AxisFlow; AxisFlow.resetSettings()
;
;  FORMAT
;     Action = Key[, Key...]        several keys may share one action
;     Action = Key Key              a TWO-KEY CHORD: press the first, then the
;                                   second (e.g. "R X"). Maximum two keys.
;     Action =                      empty value means "not assigned"
;     ; or #                        comment, whole line or after a value
;
;  SINGLE/CHORD RULE: a key is either a binding of its own or the first key of
;  a chord, never both. With "RotateAboutX = R X" defined, plain "R" cannot be
;  assigned to anything -- otherwise pressing R could only be resolved by
;  waiting to see whether a second key follows. A line that breaks the rule is
;  reported in the Report view and ignored.
;
;  KEY NAMES  (Qt names, case-insensitive)
;     letters/digits    A .. Z, 0 .. 9
;     named keys        Insert, Delete, Home, End, PgUp, PgDown, Tab,
;                       Backspace, Escape, Space, Return, Enter (numpad),
;                       Left, Right, Up, Down, F1 .. F12
;                       (the Hotkeys page of the settings dialog shows the very
;                        same names, so what you see there can be typed here)
;     punctuation       `  -  =  [  ]  ,  .  /  \  ;  '
;                       (a key that would look like a comment or a separator --
;                        ` ; # , -- still works: it is matched before comments
;                        are stripped when it stands alone as the whole value)
;     raw code          0x1000005 or 16777221, if a name will not do
;
;  Modifier combinations (Ctrl+X) are NOT used: AxisFlow deliberately never
;  claims modified keys, so they stay available to FreeCAD.
;
;  ACTIONS  (the name on the left must be spelled exactly like this)
;     ToggleActive    turn AxisFlow on/off
;     ToggleMode      switch orthogonal <-> radial
;     ConfirmPoint    place the current point (commit typed coordinates)
;     SmartLock       constrain to the axis the cursor leans towards
;                     (freezes the OTHER two fields at 0; press again to release)
;     LockX/Y/Z       freeze that coordinate field at its current value
;                     (press again to release; X/Y act in orthogonal mode only)
;     LockD           freeze the distance field (radial mode only)
;     ClearLocks      release all locks and clear typed values
;     CancelEntry     layered cancel: typed value first, then locks
;     FinishLine      finish this polyline, keep drawing
;     CancelCommand   end the whole command
;     RotateAboutX/Y/Z  turn the compass 90 deg about its own X / Y / Z axis
;     ToggleSegmentMode relayed to the getPoint consumer; the line demo uses it
;                       to switch the next segment between a line and an arc
; ===========================================================================

[hotkeys]

ToggleMode    = Space           ; orthogonal <-> radial
ConfirmPoint  = P
SmartLock     = Return, Enter   ; main Enter and numpad Enter
LockX         = X
LockY         = Y
LockZ         = Z
LockD         = D               ; radial mode: freeze the distance
FinishLine    = Escape          ; finish the line, session keeps running
CancelCommand = `               ; backtick ends the command

SetOrigin     = O
RotateTop     = T
RotateFront   = F
RotateSide    = S
RotateByView  = V
RotateCycle   = E
ToggleSegmentMode = M           ; consumer-defined; the line demo: line <-> arc

; Two-key chords (MicroStation style): press R, then the axis key. A space
; joins the two keys of one chord; a comma still separates ALTERNATIVE keys.
; Because R starts a chord it cannot also be a key of its own -- see the
; single/chord rule below.
RotateAboutX  = R X             ; turn the compass 90 deg about its own X
RotateAboutY  = R Y             ; ... about its own Y
RotateAboutZ  = R Z             ; ... about its own Z

ToggleActive  = 
ClearLocks    =
CancelEntry   =
