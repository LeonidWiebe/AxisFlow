<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- AxisFlow: square compass with red X / green Y axes -->
  <rect x="10" y="10" width="44" height="44" rx="4" fill="#F4F7FA" stroke="#5A6B7B" stroke-width="2.4"/>
  <!-- Y axis (green, up) -->
  <line x1="32" y1="32" x2="32" y2="19" stroke="#2E9E3F" stroke-width="3.4" stroke-linecap="round"/>
  <polygon points="32,14 28.3,21 35.7,21" fill="#2E9E3F"/>
  <!-- X axis (red, right) -->
  <line x1="32" y1="32" x2="45" y2="32" stroke="#D0322B" stroke-width="3.4" stroke-linecap="round"/>
  <polygon points="50,32 43,28.3 43,35.7" fill="#D0322B"/>
  <circle cx="32" cy="32" r="4.2" fill="#2C3E50"/>
</svg>
