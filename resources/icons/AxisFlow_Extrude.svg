<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Extrude: a wire (solid blue, bottom) sweeps upward into a surface.
       The swept copy is drawn dashed grey like the Move ghost, the sweep
       direction gets the red X arrow because it IS the compass X axis, and the
       base point carries the usual red/green axis hints. -->

  <!-- the surface swept out, translucent -->
  <path d="M12,46 L30,38 L52,46 L52,22 L30,14 L12,22 Z"
        fill="#2C82C9" fill-opacity="0.16" stroke="none"/>

  <!-- the swept copy of the wire, at the far end -->
  <polyline points="12,22 30,14 52,22" fill="none" stroke="#9AA7B2"
            stroke-width="2.2" stroke-dasharray="3.4 3"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ruling lines -->
  <line x1="12" y1="46" x2="12" y2="22" stroke="#2C82C9" stroke-width="1.8"
        stroke-opacity="0.55"/>
  <line x1="52" y1="46" x2="52" y2="22" stroke="#2C82C9" stroke-width="1.8"
        stroke-opacity="0.55"/>

  <!-- the source wire -->
  <polyline points="12,46 30,38 52,46" fill="none" stroke="#2C82C9"
            stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sweep direction = compass X -->
  <line x1="30" y1="36" x2="30" y2="20" stroke="#D0322B" stroke-width="2.6"
        stroke-linecap="round"/>
  <polygon points="30,13 25.8,21 34.2,21" fill="#D0322B"/>

  <!-- base point with axis hints -->
  <line x1="12" y1="46" x2="12" y2="34" stroke="#2E9E3F" stroke-width="2.2"
        stroke-linecap="round"/>
  <rect x="8" y="42" width="8" height="8" rx="1.4" fill="#2C3E50"/>
</svg>
