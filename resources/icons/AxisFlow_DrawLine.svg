<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Draw line: a polyline with vertex nodes, anchored at an axis origin -->
  <polyline points="12,50 32,24 54,36" fill="none" stroke="#2C82C9"
            stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- axis hint at the start node -->
  <line x1="12" y1="50" x2="24" y2="50" stroke="#D0322B" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="12" y2="38" stroke="#2E9E3F" stroke-width="2.2" stroke-linecap="round"/>
  <!-- vertices -->
  <rect x="8"  y="46" width="8" height="8" rx="1.4" fill="#2C3E50"/>
  <rect x="28" y="20" width="8" height="8" rx="1.4" fill="#2C3E50"/>
  <rect x="50" y="32" width="8" height="8" rx="1.4" fill="#2C3E50"/>
</svg>
